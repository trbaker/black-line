<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Outline Map Maker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --ink:#121414; --paper:#ffffff; --desk:#d3d9db; --desk-2:#c3cbce;
    --slate:#22343a; --slate-2:#1a2a2f; --chalk:#e9eeef; --muted:#9ab0b6;
    --pencil:#f2b705; --pencil-2:#d9a300; --redline:#ff7a5c; --line:rgba(233,238,239,.14);
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;color:var(--ink);
    background:radial-gradient(120% 90% at 30% 20%,var(--desk) 0%,var(--desk-2) 100%);
    display:grid;grid-template-columns:340px minmax(0,1fr);height:100vh;
  }

  /* ---------- control panel ---------- */
  aside{background:var(--slate);color:var(--chalk);overflow-y:auto;display:flex;flex-direction:column}
  .brand{padding:22px 24px 16px;border-bottom:1px solid var(--line)}
  .brand h1{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;font-size:32px;letter-spacing:.03em;text-transform:uppercase;margin:0;line-height:1}
  .brand h1 span{color:var(--pencil)}
  .brand p{margin:8px 0 0;color:var(--muted);font-size:13px;line-height:1.4}
  section{padding:18px 24px;border-bottom:1px solid var(--line)}
  h2{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:11px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:0 0 12px}

  .search{display:flex;gap:8px}
  input[type=text]{
    flex:1;min-width:0;background:var(--slate-2);color:var(--chalk);border:1px solid rgba(233,238,239,.22);border-radius:6px;
    padding:10px 12px;font:inherit;font-size:15px;outline:none;
  }
  input[type=text]::placeholder{color:rgba(154,176,182,.7)}
  input[type=text]:focus{border-color:var(--pencil);box-shadow:0 0 0 3px rgba(242,183,5,.25)}
  button{font:inherit;cursor:pointer;border:0;border-radius:6px;padding:10px 14px;font-weight:600;transition:background .15s,transform .05s}
  button:active{transform:translateY(1px)}
  button:focus-visible{outline:2px solid var(--pencil);outline-offset:2px}
  .primary{background:var(--pencil);color:var(--slate-2)}
  .primary:hover{background:var(--pencil-2)}
  .ghost{background:transparent;color:var(--chalk);border:1px solid rgba(233,238,239,.28)}
  .ghost:hover{background:rgba(233,238,239,.08)}
  button:disabled{opacity:.45;cursor:not-allowed;transform:none}

  .matches{margin-top:12px;display:none;flex-direction:column;gap:6px}
  .matches.show{display:flex}
  .matches .hint{font-size:12px;color:var(--muted);margin-bottom:2px}
  .match{background:var(--slate-2);color:var(--chalk);text-align:left;font-weight:500;padding:9px 12px;border:1px solid transparent;display:flex;justify-content:space-between;align-items:center;gap:10px}
  .match:hover{border-color:rgba(233,238,239,.28)}
  .match.active{border-color:var(--pencil)}
  .match .type{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--pencil);flex-shrink:0}
  .match .label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  .checks{display:flex;flex-direction:column;gap:2px}
  .check{display:flex;align-items:center;gap:12px;padding:8px 4px;border-radius:6px;cursor:pointer;user-select:none}
  .check:hover{background:rgba(233,238,239,.05)}
  .check input{position:absolute;opacity:0;width:0;height:0}
  .box{width:18px;height:18px;border:1.5px solid rgba(233,238,239,.5);border-radius:3px;display:grid;place-items:center;flex-shrink:0;transition:background .12s,border-color .12s}
  .box svg{width:12px;height:12px;opacity:0;stroke:var(--slate-2);stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .check input:checked + .box{background:var(--pencil);border-color:var(--pencil)}
  .check input:checked + .box svg{opacity:1}
  .check input:focus-visible + .box{outline:2px solid var(--pencil);outline-offset:2px}
  .check .txt{flex:1}
  .check .sub{display:block;font-size:12px;color:var(--muted)}
  .check .count{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--muted)}

  .field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
  .field:last-child{margin-bottom:0}
  .field label{font-size:13px;display:flex;justify-content:space-between}
  .field label output{font-family:"IBM Plex Mono",monospace;color:var(--muted);font-size:12px}
  input[type=range]{width:100%;accent-color:var(--pencil);margin:0}
  .seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid rgba(233,238,239,.28);border-radius:6px;overflow:hidden}
  .seg button{border-radius:0;background:transparent;color:var(--chalk);font-weight:500;padding:8px}
  .seg button.on{background:var(--chalk);color:var(--slate-2)}
  .hidden{display:none !important}

  .exports{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .exports .wide{grid-column:1 / -1}
  .note{font-size:12px;color:var(--muted);margin:14px 0 0;line-height:1.45}
  .note a{color:var(--chalk)}

  /* ---------- desk + sheet ---------- */
  main{display:grid;grid-template-rows:minmax(0,1fr) auto;padding:28px 28px 18px;min-width:0;min-height:0}
  .desk{position:relative;display:flex;align-items:center;justify-content:center;min-height:0}
  canvas{
    background:#fff;display:block;max-width:100%;max-height:100%;
    box-shadow:0 1px 2px rgba(0,0,0,.18),0 12px 32px -8px rgba(20,35,40,.45),0 0 0 1px rgba(0,0,0,.06);
  }
  .busy{
    position:absolute;inset:0;display:none;align-items:center;justify-content:center;pointer-events:none;
  }
  .busy.show{display:flex}
  .busy div{background:var(--slate);color:var(--chalk);font-family:"IBM Plex Mono",monospace;font-size:12px;letter-spacing:.06em;padding:10px 16px;border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,.25);display:flex;align-items:center;gap:10px}
  .busy i{width:10px;height:10px;border-radius:50%;background:var(--pencil);animation:blink 1s infinite}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
  @media (prefers-reduced-motion:reduce){.busy i{animation:none}}
  .status{
    margin-top:14px;font-family:"IBM Plex Mono",monospace;font-size:12px;color:#405056;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap
  }
  .status .err{color:#b23a25}

  @media (max-width:860px){
    body{grid-template-columns:1fr;grid-template-rows:auto 1fr;height:auto;min-height:100vh}
    aside{max-height:none}
    main{min-height:80vh}
  }
</style>
</head>
<body>

<aside>
  <div class="brand">
    <h1>Outline <span>Maps</span></h1>
    <p>Type a country, state, or province. Get a clean black-line map ready for the copier.</p>
  </div>

  <section>
    <h2>Region</h2>
    <div class="search">
      <input id="q" type="text" placeholder="Kansas, Ontario, Peru…" autocomplete="off" spellcheck="false">
      <button id="find" class="primary">Find</button>
    </div>
    <div id="matches" class="matches"></div>
  </section>

  <section>
    <h2>Show on the map</h2>
    <div class="checks" id="overlays">
      <label class="check"><input type="checkbox" id="ov-cities"><span class="box"><svg viewBox="0 0 16 16"><path d="M3 8.5l3 3 7-7"/></svg></span><span class="txt">Cities <span class="sub">Largest cities, marked with dots</span></span><span class="count" id="n-cities"></span></label>
      <label class="check"><input type="checkbox" id="ov-capitals"><span class="box"><svg viewBox="0 0 16 16"><path d="M3 8.5l3 3 7-7"/></svg></span><span class="txt">Capitals <span class="sub">National and state capitals, marked with stars</span></span><span class="count" id="n-capitals"></span></label>
      <label class="check"><input type="checkbox" id="ov-rivers"><span class="box"><svg viewBox="0 0 16 16"><path d="M3 8.5l3 3 7-7"/></svg></span><span class="txt">Rivers <span class="sub">Major named rivers</span></span><span class="count" id="n-rivers"></span></label>
      <label class="check"><input type="checkbox" id="ov-subdiv"><span class="box"><svg viewBox="0 0 16 16"><path d="M3 8.5l3 3 7-7"/></svg></span><span class="txt">Internal borders <span class="sub">States or provinces inside a country; counties inside a state</span></span><span class="count" id="n-subdiv"></span></label>
      <label class="check"><input type="checkbox" id="ov-grid"><span class="box"><svg viewBox="0 0 16 16"><path d="M3 8.5l3 3 7-7"/></svg></span><span class="txt">Latitude &amp; longitude grid</span></label>
      <label class="check"><input type="checkbox" id="ov-labels"><span class="box"><svg viewBox="0 0 16 16"><path d="M3 8.5l3 3 7-7"/></svg></span><span class="txt">Labels <span class="sub">Print the names of everything shown</span></span></label>
      <label class="check"><input type="checkbox" id="ov-title" checked><span class="box"><svg viewBox="0 0 16 16"><path d="M3 8.5l3 3 7-7"/></svg></span><span class="txt">Title &amp; name line <span class="sub">Region name plus a Name / Date line for students</span></span></label>
    </div>
  </section>

  <section>
    <h2>Sheet</h2>
    <div class="field">
      <label>Orientation</label>
      <div class="seg" id="orient">
        <button type="button" data-o="portrait">Portrait</button>
        <button type="button" data-o="landscape" class="on">Landscape</button>
      </div>
    </div>
    <div class="field">
      <label for="weight">Line weight <output id="weight-out">3</output></label>
      <input id="weight" type="range" min="1" max="6" step="1" value="3">
    </div>
    <div class="field hidden" id="cities-field">
      <label for="ncities">Cities to show <output id="ncities-out">12</output></label>
      <input id="ncities" type="range" min="3" max="40" step="1" value="12">
    </div>
  </section>

  <section>
    <h2>Export</h2>
    <div class="exports">
      <button id="jpg" class="ghost" disabled>Save as JPG</button>
      <button id="pdf" class="ghost" disabled>Save as PDF</button>
      <button id="print" class="primary wide" disabled>Print</button>
    </div>
    <p class="note">Maps print on US Letter. Boundary and place data © OpenStreetMap contributors, via Geoapify.</p>
  </section>
</aside>

<main>
  <div class="desk">
    <canvas id="sheet" width="2200" height="1700" aria-label="Map preview"></canvas>
    <div class="busy" id="busy"><div><i></i><span id="busy-text">Drawing…</span></div></div>
  </div>
  <div class="status"><span id="status">Enter a region to begin.</span><span id="scale-out"></span></div>
</main>

<script>
(() => {
  'use strict';

  // ---------------------------------------------------------------- config
  const API_KEY = '7da16f48c81f448fa972d4a52fdc1e4e';
  const GEOAPIFY = 'https://api.geoapify.com';
  const OVERPASS = 'https://overpass-api.de/api/interpreter';
  const DPI = 200;                        // sheet resolution (pixels per inch)
  const pt = p => p * DPI / 72;           // points → pixels
  const inch = i => i * DPI;

  // ---------------------------------------------------------------- state
  const state = {
    region: null,          // geocoder feature for the chosen region
    boundary: null,        // GeoJSON geometry (Polygon / MultiPolygon)
    wrap: false,           // true when the region crosses the antimeridian
    bounds: null,
    places: null,          // [{name, lon, lat, pop, capital}]
    rivers: null,          // [{name, lines:[[[lon,lat],...],...]}]
    subdiv: null,          // [{name, geometry}]
    orient: 'landscape',
    weight: 3,
    nCities: 12,
    loading: new Set(),
    seq: 0,                // bumps on every new region; stale fetches are ignored
  };

  const $ = id => document.getElementById(id);
  const canvas = $('sheet'), ctx = canvas.getContext('2d');
  const ov = {
    cities: $('ov-cities'), capitals: $('ov-capitals'), rivers: $('ov-rivers'),
    subdiv: $('ov-subdiv'), grid: $('ov-grid'), labels: $('ov-labels'), title: $('ov-title'),
  };

  // ---------------------------------------------------------------- helpers
  function setStatus(msg, isError) {
    const el = $('status');
    el.textContent = msg;
    el.className = isError ? 'err' : '';
  }
  function busy(on, text) {
    const el = $('busy');
    if (on) { state.loading.add(text); $('busy-text').textContent = text; el.classList.add('show'); }
    else { state.loading.delete(text); if (state.loading.size) $('busy-text').textContent = [...state.loading].pop(); else el.classList.remove('show'); }
  }
  async function getJSON(url, opts) {
    const res = await fetch(url, opts);
    if (res.status === 401 || res.status === 403) throw new Error('The map service rejected the API key.');
    if (res.status === 429) throw new Error('The map service is rate-limiting requests. Wait a moment and try again.');
    if (!res.ok) throw new Error(`The map service returned an error (${res.status}).`);
    return res.json();
  }
  const W = lon => (state.wrap && lon < 0) ? lon + 360 : lon;   // antimeridian unwrap

  function eachRing(geom, fn) {
    if (!geom) return;
    if (geom.type === 'Polygon') geom.coordinates.forEach(fn);
    else if (geom.type === 'MultiPolygon') geom.coordinates.forEach(poly => poly.forEach(fn));
  }
  function computeBounds(geom) {
    let minLon = 180, maxLon = -180, minLat = 90, maxLat = -90;
    eachRing(geom, ring => ring.forEach(([lon, lat]) => {
      if (lon < minLon) minLon = lon; if (lon > maxLon) maxLon = lon;
      if (lat < minLat) minLat = lat; if (lat > maxLat) maxLat = lat;
    }));
    state.wrap = (maxLon - minLon) > 180;
    if (state.wrap) {
      minLon = 360; maxLon = -360;
      eachRing(geom, ring => ring.forEach(([lon]) => { const l = W(lon); if (l < minLon) minLon = l; if (l > maxLon) maxLon = l; }));
    }
    return { minLon, maxLon, minLat, maxLat };
  }
  function ringCentroid(ring) { // area-weighted centroid of a lon/lat ring
    let a = 0, cx = 0, cy = 0;
    for (let i = 0, n = ring.length - 1; i < n; i++) {
      const [x0, y0] = ring[i], [x1, y1] = ring[i + 1];
      const f = W(x0) * y1 - W(x1) * y0;
      a += f; cx += (W(x0) + W(x1)) * f; cy += (y0 + y1) * f;
    }
    if (Math.abs(a) < 1e-12) return [W(ring[0][0]), ring[0][1], 0];
    return [cx / (3 * a), cy / (3 * a), Math.abs(a / 2)];
  }
  function largestRingCentroid(geom) {
    let best = null;
    const polys = geom.type === 'Polygon' ? [geom.coordinates] : geom.coordinates;
    polys.forEach(poly => { const c = ringCentroid(poly[0]); if (!best || c[2] > best[2]) best = c; });
    return best;
  }
  const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');

  // ---------------------------------------------------------------- region search
  async function findRegion() {
    const q = $('q').value.trim();
    if (!q) return;
    const box = $('matches');
    box.innerHTML = ''; box.classList.remove('show');
    busy(true, 'Searching…'); setStatus(`Searching for "${q}"…`);
    try {
      const url = `${GEOAPIFY}/v1/geocode/search?text=${encodeURIComponent(q)}&limit=10&lang=en&apiKey=${API_KEY}`;
      const data = await getJSON(url);
      const wanted = ['country', 'state', 'county', 'city'];
      let feats = (data.features || []).filter(f => wanted.includes(f.properties.result_type));
      if (!feats.length) feats = data.features || [];
      // de-duplicate by place_id
      const seen = new Set(); feats = feats.filter(f => !seen.has(f.properties.place_id) && seen.add(f.properties.place_id));
      if (!feats.length) { setStatus(`No region called "${q}" was found. Try adding the country, e.g. "Georgia, USA".`, true); return; }
      if (feats.length === 1) { chooseRegion(feats[0]); return; }
      box.innerHTML = '<div class="hint">Several places match — pick one:</div>';
      feats.slice(0, 6).forEach(f => {
        const b = document.createElement('button');
        b.type = 'button'; b.className = 'match';
        b.innerHTML = `<span class="label">${f.properties.formatted}</span><span class="type">${f.properties.result_type}</span>`;
        b.addEventListener('click', () => { [...box.children].forEach(c => c.classList.remove('active')); b.classList.add('active'); chooseRegion(f); });
        box.appendChild(b);
      });
      box.classList.add('show');
      setStatus('Choose a match on the left.');
    } catch (e) { setStatus(e.message, true); }
    finally { busy(false, 'Searching…'); }
  }

  async function chooseRegion(feature) {
    const seq = ++state.seq;
    const p = feature.properties;
    state.region = feature; state.boundary = null; state.places = state.rivers = state.subdiv = null;
    ['n-cities', 'n-capitals', 'n-rivers', 'n-subdiv'].forEach(id => $(id).textContent = '');
    render();
    busy(true, 'Loading outline…'); setStatus(`Loading the outline of ${p.formatted}…`);
    try {
      const url = `${GEOAPIFY}/v2/place-details?id=${encodeURIComponent(p.place_id)}&features=details&apiKey=${API_KEY}`;
      const data = await getJSON(url);
      if (seq !== state.seq) return;
      const det = (data.features || []).find(f => f.properties.feature_type === 'details') || data.features?.[0];
      const g = det && det.geometry;
      if (!g || (g.type !== 'Polygon' && g.type !== 'MultiPolygon')) {
        setStatus(`No outline is available for ${p.formatted}. Try a larger region.`, true); return;
      }
      state.boundary = g;
      state.bounds = computeBounds(g);
      render();
      setStatus(`${regionName()} ready.`);
      ['jpg', 'pdf', 'print'].forEach(id => $(id).disabled = false);
      refreshOverlays();
    } catch (e) { if (seq === state.seq) setStatus(e.message, true); }
    finally { busy(false, 'Loading outline…'); }
  }

  const regionName = () => state.region ? (state.region.properties.name || state.region.properties.formatted.split(',')[0]) : '';
  const regionType = () => state.region ? state.region.properties.result_type : '';

  // ---------------------------------------------------------------- overlays (fetched lazily, cached per region)
  function refreshOverlays() {
    if (!state.boundary) return;
    if ((ov.cities.checked || ov.capitals.checked) && !state.places) loadPlaces();
    if (ov.rivers.checked && !state.rivers) loadRivers();
    if (ov.subdiv.checked && !state.subdiv) loadSubdivisions();
    render();
  }

  async function loadPlaces() {
    const seq = state.seq, pid = state.region.properties.place_id;
    busy(true, 'Finding cities…');
    try {
      const isCountry = regionType() === 'country';
      const cats = isCountry ? 'populated_place.city' : 'populated_place.city,populated_place.town';
      const url = `${GEOAPIFY}/v2/places?categories=${cats}&filter=place:${pid}&limit=400&lang=en&apiKey=${API_KEY}`;
      const data = await getJSON(url);
      if (seq !== state.seq) return;
      const seen = new Set();
      const places = [];
      (data.features || []).forEach(f => {
        const pr = f.properties, raw = (pr.datasource && pr.datasource.raw) || {};
        const name = pr.name || raw.name; if (!name) return;
        const key = name + '|' + pr.lon.toFixed(2) + '|' + pr.lat.toFixed(2);
        if (seen.has(key)) return; seen.add(key);
        const cap = String(raw.capital || '');
        places.push({
          name, lon: pr.lon, lat: pr.lat,
          pop: parseInt(String(raw.population || '').replace(/\D/g, ''), 10) || 0,
          capital: cap === 'yes' || cap === '2' ? 'national' : cap === '4' ? 'regional' : null,
        });
      });
      places.sort((a, b) => b.pop - a.pop);
      state.places = places;
      $('n-cities').textContent = places.length ? `${places.length} found` : 'none';
      $('n-capitals').textContent = places.filter(p => p.capital).length || 'none';
      if (!places.length) setStatus('No cities were found inside this region.', true);
    } catch (e) { if (seq === state.seq) { state.places = []; setStatus('Cities could not be loaded: ' + e.message, true); } }
    finally { busy(false, 'Finding cities…'); render(); }
  }

  async function loadRivers() {
    const seq = state.seq, pid = state.region.properties.place_id;
    busy(true, 'Tracing rivers…');
    try {
      // 1) ask the map service which named rivers lie inside the region
      const url = `${GEOAPIFY}/v2/places?categories=waterway.river_system,natural.water.river_system&filter=place:${pid}&limit=40&lang=en&apiKey=${API_KEY}`;
      const data = await getJSON(url);
      if (seq !== state.seq) return;
      const rels = new Set(), ways = new Set(), names = {};
      (data.features || []).forEach(f => {
        const pr = f.properties, raw = (pr.datasource && pr.datasource.raw) || {};
        const id = raw.osm_id, t = String(raw.osm_type || '').toLowerCase();
        if (!id) return;
        if (t === 'r' || t === 'relation') { rels.add(id); names['r' + id] = pr.name || raw.name; }
        else if (t === 'w' || t === 'way') { ways.add(id); names['w' + id] = pr.name || raw.name; }
      });
      // 2) fetch the actual river lines from OpenStreetMap (Overpass)
      let query;
      if (rels.size || ways.size) {
        query = `[out:json][timeout:90];(${rels.size ? `rel(id:${[...rels].join(',')});` : ''}${ways.size ? `way(id:${[...ways].join(',')});` : ''});out geom;`;
      } else {
        const b = state.bounds, lo = l => state.wrap && l > 180 ? l - 360 : l;
        query = `[out:json][timeout:90][bbox:${b.minLat},${lo(b.minLon)},${b.maxLat},${lo(b.maxLon)}];relation["waterway"="river"]["name"]["wikidata"];out geom 40;`;
      }
      const osm = await getJSON(OVERPASS, { method: 'POST', body: 'data=' + encodeURIComponent(query), headers: { 'Content-Type': 'application/x-www-form-urlencoded' } });
      if (seq !== state.seq) return;
      const rivers = [];
      (osm.elements || []).forEach(el => {
        const name = (el.tags && (el.tags['name:en'] || el.tags.name)) || names[el.type[0] + el.id] || '';
        const lines = [];
        if (el.type === 'relation') {
          (el.members || []).forEach(m => {
            if (m.type !== 'way' || !m.geometry) return;
            if (m.role && !['', 'main_stream', 'outer', 'main'].includes(m.role)) return;
            lines.push(m.geometry.map(g => [g.lon, g.lat]));
          });
        } else if (el.type === 'way' && el.geometry) {
          lines.push(el.geometry.map(g => [g.lon, g.lat]));
        }
        if (lines.length) rivers.push({ name, lines });
      });
      state.rivers = rivers;
      $('n-rivers').textContent = rivers.length ? `${rivers.length} found` : 'none';
      if (!rivers.length) setStatus('No named rivers were found inside this region.', true);
    } catch (e) { if (seq === state.seq) { state.rivers = []; setStatus('Rivers could not be loaded: ' + e.message, true); } }
    finally { busy(false, 'Tracing rivers…'); render(); }
  }

  async function loadSubdivisions() {
    const seq = state.seq, pid = state.region.properties.place_id;
    busy(true, 'Loading internal borders…');
    try {
      const url = `${GEOAPIFY}/v1/boundaries/consists-of?id=${encodeURIComponent(pid)}&geometry=geometry_1000&lang=en&apiKey=${API_KEY}`;
      const data = await getJSON(url);
      if (seq !== state.seq) return;
      const subs = (data.features || [])
        .filter(f => f.geometry && (f.geometry.type === 'Polygon' || f.geometry.type === 'MultiPolygon'))
        .map(f => ({ name: f.properties.name || f.properties.formatted || '', geometry: f.geometry }));
      state.subdiv = subs;
      $('n-subdiv').textContent = subs.length ? `${subs.length} found` : 'none';
      if (!subs.length) setStatus('No internal borders are available for this region.', true);
    } catch (e) { if (seq === state.seq) { state.subdiv = []; setStatus('Internal borders could not be loaded: ' + e.message, true); } }
    finally { busy(false, 'Loading internal borders…'); render(); }
  }

  // ---------------------------------------------------------------- drawing
  function sheetSize() {
    return state.orient === 'landscape' ? { w: inch(11), h: inch(8.5) } : { w: inch(8.5), h: inch(11) };
  }
  function makeProjection(b, rect) {
    const k = Math.cos((b.minLat + b.maxLat) / 2 * Math.PI / 180);
    const dw = (b.maxLon - b.minLon) * k, dh = (b.maxLat - b.minLat);
    const s = Math.min(rect.w / dw, rect.h / dh);
    const ox = rect.x + (rect.w - dw * s) / 2, oy = rect.y + (rect.h - dh * s) / 2;
    return { s, k, xy: (lon, lat) => [ox + (W(lon) - b.minLon) * k * s, oy + (b.maxLat - lat) * s] };
  }
  function tracePolygon(geom, proj) {
    ctx.beginPath();
    eachRing(geom, ring => {
      ring.forEach(([lon, lat], i) => { const [x, y] = proj.xy(lon, lat); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
      ctx.closePath();
    });
  }
  function star(x, y, r) {
    ctx.beginPath();
    for (let i = 0; i < 10; i++) {
      const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.45 : r;
      ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
    }
    ctx.closePath();
  }
  function fitFont(px, weight, family) { return `${weight} ${px}px ${family}`; }
  const SANS = '"IBM Plex Sans","Helvetica Neue",Arial,sans-serif';
  const COND = '"Barlow Condensed","Arial Narrow",Impact,sans-serif';
  const MONO = '"IBM Plex Mono",Menlo,Consolas,monospace';
  const SERIF = 'Georgia,"Times New Roman",serif';
  const nice = v => { const p = Math.pow(10, Math.floor(Math.log10(v))); const m = v / p; return (m >= 5 ? 5 : m >= 2.5 ? 2.5 : m >= 2 ? 2 : 1) * p; };

  function render() {
    const { w, h } = sheetSize();
    if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
    fitPreview();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h);
    ctx.strokeStyle = '#000'; ctx.fillStyle = '#000'; ctx.lineJoin = 'round'; ctx.lineCap = 'round';

    const margin = inch(0.5);
    const showTitle = ov.title.checked;
    const top = margin + (showTitle ? inch(0.95) : 0);
    const bottom = h - margin - inch(0.55);
    const frame = { x: margin, y: top, w: w - 2 * margin, h: bottom - top };
    const lw = state.weight * DPI / 100;   // boundary line width in px

    // --- title band
    if (showTitle) {
      const name = state.boundary ? regionName() : 'Outline map';
      ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'left';
      ctx.font = fitFont(pt(30), 700, COND);
      ctx.fillText(name.toUpperCase(), frame.x, margin + pt(30));
      if (state.boundary) {
        ctx.font = fitFont(pt(9.5), 400, SANS); ctx.fillStyle = '#333';
        ctx.fillText(state.region.properties.formatted, frame.x, margin + pt(30) + pt(14));
        ctx.fillStyle = '#000';
      }
      // name / date line, right-aligned
      ctx.font = fitFont(pt(10), 500, SANS); ctx.textAlign = 'right';
      const y = margin + pt(30);
      const dateW = inch(1.4), nameW = inch(2.6), gap = inch(0.25);
      ctx.lineWidth = pt(0.8);
      ctx.fillText('Date', frame.x + frame.w - dateW - pt(6), y);
      ctx.beginPath(); ctx.moveTo(frame.x + frame.w - dateW, y + pt(2)); ctx.lineTo(frame.x + frame.w, y + pt(2)); ctx.stroke();
      const nx = frame.x + frame.w - dateW - gap - inch(0.4);
      ctx.fillText('Name', nx - nameW - pt(6), y);
      ctx.beginPath(); ctx.moveTo(nx - nameW, y + pt(2)); ctx.lineTo(nx, y + pt(2)); ctx.stroke();
      ctx.textAlign = 'left';
    }

    // --- neatline
    ctx.lineWidth = pt(1);
    ctx.strokeRect(frame.x, frame.y, frame.w, frame.h);

    if (!state.boundary) {
      ctx.fillStyle = '#9aa5a8'; ctx.textAlign = 'center'; ctx.font = fitFont(pt(13), 400, SANS);
      ctx.fillText('Find a region to draw its outline here.', frame.x + frame.w / 2, frame.y + frame.h / 2);
      ctx.fillStyle = '#000'; ctx.textAlign = 'left';
      drawCredit(frame, h, margin);
      $('scale-out').textContent = '';
      return;
    }

    const inset = inch(0.3);
    const proj = makeProjection(state.bounds, { x: frame.x + inset, y: frame.y + inset, w: frame.w - 2 * inset, h: frame.h - 2 * inset });
    const labels = [];   // placed label rectangles, for collision avoidance
    const placeLabel = (x, y, tw, th) => {
      if (x < frame.x || y < frame.y || x + tw > frame.x + frame.w || y + th > frame.y + frame.h) return false;
      for (const r of labels) if (x < r.x + r.w && x + tw > r.x && y < r.y + r.h && y + th > r.y) return false;
      labels.push({ x, y, w: tw, h: th }); return true;
    };

    ctx.save();
    ctx.beginPath(); ctx.rect(frame.x, frame.y, frame.w, frame.h); ctx.clip();

    // --- graticule
    if (ov.grid.checked) {
      const b = state.bounds, span = Math.max(b.maxLon - b.minLon, b.maxLat - b.minLat);
      const step = [0.25, 0.5, 1, 2, 5, 10, 15, 20, 30].find(s => span / s <= 8) || 30;
      ctx.lineWidth = Math.max(1, lw * 0.18); ctx.setLineDash([pt(3), pt(3)]);
      ctx.font = fitFont(pt(7), 400, MONO); ctx.fillStyle = '#000';
      for (let lon = Math.ceil(b.minLon / step) * step; lon <= b.maxLon; lon += step) {
        const [x] = proj.xy(lon, b.minLat);
        ctx.beginPath(); ctx.moveTo(x, frame.y); ctx.lineTo(x, frame.y + frame.h); ctx.stroke();
        const real = lon > 180 ? lon - 360 : lon;
        ctx.textAlign = 'center'; ctx.textBaseline = 'top';
        ctx.fillText(`${Math.abs(real)}°${real < 0 ? 'W' : real > 0 ? 'E' : ''}`, x, frame.y + pt(3));
      }
      for (let lat = Math.ceil(b.minLat / step) * step; lat <= b.maxLat; lat += step) {
        const [, y] = proj.xy(b.minLon, lat);
        ctx.beginPath(); ctx.moveTo(frame.x, y); ctx.lineTo(frame.x + frame.w, y); ctx.stroke();
        ctx.textAlign = 'left'; ctx.textBaseline = 'bottom';
        ctx.fillText(`${Math.abs(lat)}°${lat < 0 ? 'S' : lat > 0 ? 'N' : ''}`, frame.x + pt(3), y - pt(2));
      }
      ctx.setLineDash([]);
    }

    // --- internal borders
    if (ov.subdiv.checked && state.subdiv && state.subdiv.length) {
      ctx.lineWidth = Math.max(1, lw * 0.4);
      state.subdiv.forEach(s => { tracePolygon(s.geometry, proj); ctx.stroke(); });
    }

    // --- rivers (clipped to the region)
    if (ov.rivers.checked && state.rivers && state.rivers.length) {
      ctx.save();
      tracePolygon(state.boundary, proj); ctx.clip('evenodd');
      ctx.lineWidth = Math.max(1, lw * 0.45);
      state.rivers.forEach(r => {
        ctx.beginPath();
        r.lines.forEach(line => line.forEach(([lon, lat], i) => { const [x, y] = proj.xy(lon, lat); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }));
        ctx.stroke();
      });
      ctx.restore();
    }

    // --- region outline
    ctx.lineWidth = lw;
    tracePolygon(state.boundary, proj); ctx.stroke();

    // --- cities & capitals
    const dotR = pt(3.2) * (0.7 + state.weight * 0.1), starR = dotR * 2.1;
    const drawn = [];
    if (state.places && (ov.cities.checked || ov.capitals.checked)) {
      const caps = ov.capitals.checked ? state.places.filter(p => p.capital) : [];
      const rest = state.places.filter(p => !caps.includes(p));
      const cities = ov.cities.checked ? rest.slice(0, state.nCities) : [];
      caps.forEach(p => {
        const [x, y] = proj.xy(p.lon, p.lat);
        const r = p.capital === 'national' ? starR * 1.25 : starR;
        star(x, y, r); ctx.fillStyle = '#fff'; ctx.fill(); ctx.lineWidth = Math.max(1, lw * 0.35); ctx.stroke();
        ctx.fillStyle = '#000';
        if (p.capital === 'national') { star(x, y, r * 0.55); ctx.fill(); }
        drawn.push({ p, x, y, r });
      });
      cities.forEach(p => {
        const [x, y] = proj.xy(p.lon, p.lat);
        ctx.beginPath(); ctx.arc(x, y, dotR, 0, Math.PI * 2); ctx.fill();
        drawn.push({ p, x, y, r: dotR });
      });
    }

    // --- labels
    if (ov.labels.checked) {
      ctx.textBaseline = 'middle';
      // subdivision names first (largest features, lowest priority visually)
      if (ov.subdiv.checked && state.subdiv && state.subdiv.length) {
        ctx.font = fitFont(pt(7.5), 500, SANS); ctx.fillStyle = '#000'; ctx.textAlign = 'center';
        state.subdiv.forEach(s => {
          if (!s.name) return;
          const c = largestRingCentroid(s.geometry); const [x, y] = proj.xy(c[0] > 180 ? c[0] - 360 : c[0], c[1]);
          const t = s.name.toUpperCase(), tw = ctx.measureText(t).width, th = pt(9);
          if (placeLabel(x - tw / 2, y - th / 2, tw, th)) ctx.fillText(t, x, y);
        });
      }
      // city and capital names, next to their markers
      ctx.textAlign = 'left';
      drawn.forEach(({ p, x, y, r }) => {
        const bold = !!p.capital;
        ctx.font = fitFont(pt(bold ? 9.5 : 8.5), bold ? 600 : 400, SANS);
        const tw = ctx.measureText(p.name).width, th = pt(11), pad = r + pt(3);
        const tries = [[x + pad, y - th / 2], [x - pad - tw, y - th / 2], [x - tw / 2, y - pad - th], [x - tw / 2, y + pad]];
        for (const [lx, ly] of tries) {
          if (placeLabel(lx, ly, tw, th)) {
            ctx.fillStyle = '#fff'; ctx.lineWidth = pt(3); ctx.lineJoin = 'round'; ctx.strokeStyle = '#fff';
            ctx.strokeText(p.name, lx, ly + th / 2);
            ctx.fillStyle = '#000'; ctx.strokeStyle = '#000';
            ctx.fillText(p.name, lx, ly + th / 2);
            break;
          }
        }
      });
      // river names, set along the river
      if (ov.rivers.checked && state.rivers && state.rivers.length) {
        ctx.font = `italic 400 ${pt(7.5)}px ${SERIF}`;
        state.rivers.forEach(r => {
          if (!r.name) return;
          // pick the longest projected line, then its middle segment
          let best = null, bestLen = 0;
          r.lines.forEach(line => {
            const pts = line.map(([lon, lat]) => proj.xy(lon, lat));
            let len = 0; for (let i = 1; i < pts.length; i++) len += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
            if (len > bestLen) { bestLen = len; best = pts; }
          });
          if (!best || best.length < 2) return;
          const i = Math.floor(best.length / 2), a = best[Math.max(0, i - 2)], b = best[Math.min(best.length - 1, i + 2)];
          let ang = Math.atan2(b[1] - a[1], b[0] - a[0]);
          if (ang > Math.PI / 2) ang -= Math.PI; if (ang < -Math.PI / 2) ang += Math.PI;
          const tw = ctx.measureText(r.name).width, th = pt(9);
          const [cx, cy] = best[i];
          if (!placeLabel(cx - tw / 2, cy - th, tw, th)) return;
          ctx.save(); ctx.translate(cx, cy); ctx.rotate(ang);
          ctx.textAlign = 'center';
          ctx.strokeStyle = '#fff'; ctx.lineWidth = pt(3); ctx.strokeText(r.name, 0, -pt(4));
          ctx.fillStyle = '#000'; ctx.fillText(r.name, 0, -pt(4));
          ctx.restore(); ctx.strokeStyle = '#000';
        });
      }
    }
    ctx.restore(); // frame clip

    // --- north arrow (top-right inside the frame)
    {
      const x = frame.x + frame.w - inch(0.4), y = frame.y + inch(0.55), s = inch(0.16);
      ctx.beginPath(); ctx.moveTo(x, y - s); ctx.lineTo(x + s * 0.45, y + s * 0.6); ctx.lineTo(x, y + s * 0.3); ctx.lineTo(x - s * 0.45, y + s * 0.6); ctx.closePath();
      ctx.lineWidth = pt(1); ctx.fillStyle = '#fff'; ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x, y - s); ctx.lineTo(x + s * 0.45, y + s * 0.6); ctx.lineTo(x, y + s * 0.3); ctx.closePath(); ctx.fillStyle = '#000'; ctx.fill();
      ctx.font = fitFont(pt(9), 700, SANS); ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
      ctx.fillText('N', x, y - s - pt(2));
    }

    // --- scale bar
    {
      const mPerPx = 111320 / proj.s;                 // metres per pixel at the map's centre latitude
      const km = nice(inch(1.8) * mPerPx / 1000);      // a round distance ~1.8 in long
      const barPx = km * 1000 / mPerPx, mi = km * 0.621371;
      const x = frame.x, y = frame.y + frame.h + inch(0.22);
      ctx.lineWidth = pt(1); ctx.fillStyle = '#000';
      ctx.fillRect(x, y, barPx / 2, pt(4)); ctx.strokeRect(x, y, barPx, pt(4));
      ctx.font = fitFont(pt(7.5), 400, MONO); ctx.textBaseline = 'bottom';
      ctx.textAlign = 'left'; ctx.fillText('0', x, y - pt(2));
      ctx.textAlign = 'center'; ctx.fillText(`${km % 1 ? km.toFixed(1) : km} km`, x + barPx, y - pt(2));
      ctx.textAlign = 'left'; ctx.textBaseline = 'top';
      ctx.fillText(`≈ ${mi < 10 ? mi.toFixed(1) : Math.round(mi)} miles`, x, y + pt(6));
      const ratio = mPerPx * DPI / 0.0254;
      const rounded = Number(ratio.toPrecision(2)).toLocaleString('en-US');
      ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
      ctx.fillText(`Scale 1 : ${rounded}`, frame.x + frame.w / 2, y + pt(4));
      $('scale-out').textContent = `1 : ${rounded}`;
    }
    drawCredit(frame, h, margin);
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  }

  function drawCredit(frame, h, margin) {
    ctx.font = fitFont(pt(6.5), 400, MONO); ctx.fillStyle = '#444'; ctx.textAlign = 'right'; ctx.textBaseline = 'bottom';
    ctx.fillText('© OpenStreetMap contributors · Geoapify', frame.x + frame.w, h - margin);
    ctx.fillStyle = '#000';
  }

  // scale the canvas element to fit the desk without changing its pixel size
  function fitPreview() {
    const desk = canvas.parentElement, aw = desk.clientWidth, ah = desk.clientHeight;
    if (!aw || !ah) return;
    const s = Math.min(aw / canvas.width, ah / canvas.height);
    canvas.style.width = Math.floor(canvas.width * s) + 'px';
    canvas.style.height = Math.floor(canvas.height * s) + 'px';
  }

  // ---------------------------------------------------------------- export
  const fileBase = () => `${slug(regionName()) || 'map'}-outline-map`;
  function exportJPG() {
    const a = document.createElement('a');
    a.href = canvas.toDataURL('image/jpeg', 0.92); a.download = fileBase() + '.jpg';
    document.body.appendChild(a); a.click(); a.remove();
    setStatus(`Saved ${fileBase()}.jpg`);
  }
  function exportPDF() {
    if (!window.jspdf) { setStatus('The PDF library did not load. Check your internet connection and reload the page.', true); return; }
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ orientation: state.orient, unit: 'in', format: 'letter' });
    const pw = state.orient === 'landscape' ? 11 : 8.5, ph = state.orient === 'landscape' ? 8.5 : 11;
    doc.addImage(canvas.toDataURL('image/jpeg', 0.92), 'JPEG', 0, 0, pw, ph);
    doc.save(fileBase() + '.pdf');
    setStatus(`Saved ${fileBase()}.pdf`);
  }
  function printMap() {
    const url = canvas.toDataURL('image/png');
    const win = window.open('', '_blank');
    if (!win) { setStatus('The print window was blocked. Allow pop-ups for this page and try again.', true); return; }
    win.document.write(`<!doctype html><html><head><title>${regionName() || 'Outline map'}</title>
      <style>@page{size:letter ${state.orient};margin:0}html,body{margin:0;background:#fff}img{width:100%;height:auto;display:block}</style></head>
      <body><img src="${url}" onload="setTimeout(function(){window.focus();window.print();},250)"></body></html>`);
    win.document.close();
  }

  // ---------------------------------------------------------------- wiring
  $('find').addEventListener('click', findRegion);
  $('q').addEventListener('keydown', e => { if (e.key === 'Enter') findRegion(); });
  Object.values(ov).forEach(cb => cb.addEventListener('change', () => {
    $('cities-field').classList.toggle('hidden', !ov.cities.checked);
    refreshOverlays();
  }));
  $('weight').addEventListener('input', e => { state.weight = +e.target.value; $('weight-out').textContent = e.target.value; render(); });
  $('ncities').addEventListener('input', e => { state.nCities = +e.target.value; $('ncities-out').textContent = e.target.value; render(); });
  $('orient').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    state.orient = b.dataset.o;
    [...$('orient').children].forEach(c => c.classList.toggle('on', c === b));
    render();
  });
  $('jpg').addEventListener('click', exportJPG);
  $('pdf').addEventListener('click', exportPDF);
  $('print').addEventListener('click', printMap);
  window.addEventListener('resize', fitPreview);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(render);
  render();
})();
</script>
</body>
</html>
